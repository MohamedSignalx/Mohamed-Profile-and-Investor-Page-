/* model: give every node a 3D position */
let SPREAD=130;
const nodes=DATA.nodes.map((n,i)=>{ const a=i*2.399963, r=(n.isHub?0.35:1)*SPREAD*(0.4+Math.random?0:0);
  // deterministic fibonacci sphere
  const t=i/DATA.nodes.length, phi=Math.acos(1-2*t), th=a;
  const R=(n.isHub?0.45:1)*SPREAD*(0.6+((i*97)%50)/100);
  return {...n, x:R*Math.sin(phi)*Math.cos(th), y:R*Math.sin(phi)*Math.sin(th), z:R*Math.cos(phi),
    vx:0,vy:0,vz:0, rad:(n.isSignal?7:n.isHub?9:3)+Math.sqrt(n.degree)*(n.isSignal?1:1.4)};});
const byId=new Map(nodes.map(n=>[n.id,n]));
const links=DATA.edges.map(e=>({s:byId.get(e.source),t:byId.get(e.target),kind:e.kind})).filter(l=>l.s&&l.t);
const adj=new Map(nodes.map(n=>[n.id,[]]));
links.forEach(l=>{adj.get(l.s.id).push(l.t.id);adj.get(l.t.id).push(l.s.id);});

  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const x1=n.x*cy+n.z*sy, z1=-n.x*sy+n.z*cy, y1=n.y;

  const s=focal/zc;

/* physics in 3D */
function step(){
  const act=nodes.filter(vis);
  for(let i=0;i<act.length;i++){const a=act[i];
    for(let j=i+1;j<act.length;j++){const b=act[j];
      let dx=a.x-b.x,dy=a.y-b.y,dz=a.z-b.z,d2=dx*dx+dy*dy+dz*dz||1; if(d2>160000)continue;

  for(const n of act){ const g=0.0015; n.vx-=n.x*g;n.vy-=n.y*g;n.vz-=n.z*g;
    n.x+=n.vx;n.y+=n.vy;n.z+=n.vz;n.vx*=0.86;n.vy*=0.86;n.vz*=0.86;}
  if(spin&&!dragging) yaw+=0.0016;

  const fade=zc=>P.depth?(0.25+0.75*(1-(zc-zmin)/((zmax-zmin)||1))):1;

  // edges
  for(const l of links){ if(!vis(l.s)||!vis(l.t))continue;
    const a=project(l.s),b=project(l.t); if(!a||!b)continue;
    const on=!focus||(focus.has(l.s.id)&&focus.has(l.t.id));
    const al=(on?(l.kind==='signal'?0.5:l.kind==='cat'?0.12:0.22):0.03)*fade((a.zc+b.zc)/2);
    ctx.strokeStyle=l.kind==='signal'?`rgba(${TH.sig},${al})`:`rgba(${TH.link},${al})`;
    ctx.lineWidth=on?1:0.6; ctx.beginPath();ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);ctx.stroke();
  }
  // nodes (near last)
  for(let i=proj.length-1;i>=0;i--){ const p=proj[i],n=p.n;
    const dim=focus&&!focus.has(n.id);
    const r=Math.max(1,n.rad*p.s), col=colorOf(n.category), f=fade(p.zc);
    const rgb=RGB[n.category]||[157,176,208];
    if(n.isSignal&&!dim){ const tw=Math.pow(0.5+0.5*Math.sin(phase*Math.PI*2*1.4+n.rank*2.1),3);
      ctx.globalAlpha=(0.08+0.24*tw)*f; ctx.strokeStyle=col; ctx.lineWidth=1.2;
      ctx.beginPath();ctx.arc(p.sx,p.sy,r+3+2.5*tw,0,7);ctx.stroke();
      ctx.shadowBlur=(8+14*tw)*f*TH.glow; ctx.shadowColor=col; }
    else if(P.glow&&!dim){ ctx.shadowBlur=(n.isHub?20:11)*f*TH.glow; ctx.shadowColor=col; } else ctx.shadowBlur=0;
    ctx.globalAlpha=dim?0.12:f;
    ctx.beginPath();ctx.arc(p.sx,p.sy,r,0,7);
    ctx.fillStyle=`rgb(${rgb[0]},${rgb[1]},${rgb[2]})`; ctx.fill(); ctx.shadowBlur=0; if(LIGHT&&!dim){ctx.globalAlpha=f*0.5;ctx.lineWidth=0.7;ctx.strokeStyle='rgba(20,35,28,0.5)';ctx.stroke();}
    if((n.isHub||n===selected)&&!dim){ctx.globalAlpha=f;ctx.lineWidth=1.4;ctx.strokeStyle=TH.strokeStrong;ctx.stroke();}
    ctx.globalAlpha=1;
    const lab=!dim&&P.labels>0&&(n.isHub||n.isSignal||n===selected||n===hoverNode||n.degree>=(12-P.labels));
    if(lab&&p.s>0.5){ ctx.globalAlpha=Math.min(1,f+0.2);
      ctx.font=(n.isHub?'600 12px':'11px')+' IBM Plex Sans,sans-serif';
      ctx.fillStyle=n.isHub||n.isSignal?TH.labelStrong:'rgba('+TH.label+',0.85)';
      ctx.fillText((n.isHub||n.isSignal?n.name:(n.title||n.name)).slice(0,34), p.sx+r+4, p.sy+3.5); ctx.globalAlpha=1; }
  }
}
function loop(){step();draw();requestAnimationFrame(loop);}

/* picking */
function pick(mx,my){ let best=null,bd=1e9;
  for(const n of nodes){ if(!vis(n))continue; const p=project(n); if(!p)continue;
    const r=Math.max(3,n.rad*p.s)+6, d=(p.sx-mx)**2+(p.sy-my)**2;
    if(d<r*r && p.zc<bd){bd=p.zc;best=n;} } return best; }

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function inspect(n){const el=document.getElementById('inspector');
  if(!n){el.className='';el.textContent='Click a star to inspect its note and connections. The galaxy auto-rotates — drag to spin it yourself.';return;}
  el.className='has';
  const conns=adj.get(n.id).map(id=>byId.get(id)).filter(m=>vis(m)).sort((a,b)=>b.degree-a.degree).slice(0,12);
  el.innerHTML=`<span class="it">${esc(n.title||n.name)}</span><span class="ic">${n.icon} ${n.category}${n.isHub?' · hub':''} · ${n.degree} links</span>`+
    (n.excerpt?`<span class="ix">${esc(n.excerpt)}${n.isHub||n.isSignal?'':'…'}</span>`:'')+
    `<div class="conns">${conns.map(c=>`<a data-id="${esc(c.id)}">↳ ${esc(c.title||c.name)}</a>`).join('')}</div>`;
  el.querySelectorAll('a').forEach(a=>a.onclick=()=>select(byId.get(a.dataset.id),true));
}
const isMobile=()=>matchMedia('(max-width:820px)').matches;
function select(n,fly){ selected=n; inspect(n);
  if(n&&fly){ const ang=Math.atan2(n.x,n.z); yaw=-ang; pitch=Math.max(-0.6,Math.min(0.6,-n.y/260)); }
  if(n&&isMobile())document.getElementById('left').classList.add('open'); syncSwitcher(); if(n)showCrumb(n);else hideCrumb(); }

/* interaction */
let dragging=false,last={x:0,y:0},moved=0,pinch=null;
cv.addEventListener('mousedown',e=>{dragging=true;moved=0;last={x:e.clientX,y:e.clientY};});
addEventListener('mousemove',e=>{ const n=pick(e.clientX,e.clientY); hoverNode=n;
  if(n){tip.style.opacity=1;tip.textContent=(n.title||n.name)+' · '+n.degree+' links';tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';}
  else tip.style.opacity=0;
  if(dragging){yaw+=(e.clientX-last.x)*0.006;pitch+=(e.clientY-last.y)*0.006;pitch=Math.max(-1.4,Math.min(1.4,pitch));last={x:e.clientX,y:e.clientY};moved+=Math.abs(e.movementX)+Math.abs(e.movementY);}});
addEventListener('mouseup',e=>{ if(dragging&&moved<4){const n=pick(e.clientX,e.clientY);select(n||null);} dragging=false;});
cv.addEventListener('wheel',e=>{e.preventDefault();camDist=Math.max(150,Math.min(1400,camDist*(e.deltaY<0?0.9:1.1)));},{passive:false});
/* touch */
cv.addEventListener('touchstart',e=>{ if(e.touches.length===1){dragging=true;moved=0;last={x:e.touches[0].clientX,y:e.touches[0].clientY};}
  else if(e.touches.length===2)pinch=tdist(e.touches);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();
  if(e.touches.length===2&&pinch){const d=tdist(e.touches);camDist=Math.max(150,Math.min(1400,camDist*pinch/d));pinch=d;return;}
  const t=e.touches[0]; if(dragging){yaw+=(t.clientX-last.x)*0.006;pitch+=(t.clientY-last.y)*0.006;pitch=Math.max(-1.4,Math.min(1.4,pitch));last={x:t.clientX,y:t.clientY};moved+=10;}},{passive:false});
let lastTap=0;
cv.addEventListener('touchend',e=>{ if(dragging&&moved<8){const t=e.changedTouches[0];const n=pick(t.clientX,t.clientY);
    if(n)select(n); else {const now=performance?0:0;} }
  if(e.touches.length===0)dragging=false; pinch=null;},{passive:false});
const tdist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);

/* controls */
const $=id=>document.getElementById(id);
$('spin').onchange=e=>spin=e.target.checked;
$('glow').onchange=e=>P.glow=e.target.checked;
$('depth').onchange=e=>P.depth=e.target.checked;
$('labels').oninput=e=>{P.labels=+e.target.value;$('vLab').textContent=P.labels;};
$('spread').oninput=e=>{SPREAD=+e.target.value;$('vSpread').textContent=SPREAD;};
$('search').oninput=e=>{const q=e.target.value.trim().toLowerCase();if(!q){select(null);return;}
  const hit=nodes.find(n=>!n.isHub&&((n.title||'').toLowerCase().includes(q)||n.name.toLowerCase().includes(q)));if(hit)select(hit,true);};
$('reset').onclick=()=>{yaw=0.5;pitch=-0.25;camDist=520;select(null);};
let touring=false;
$('tour').onclick=()=>{ if(touring){touring=false;$('tour').classList.remove('active');return;}
  touring=true;$('tour').classList.add('active');
  const stops=[...nodes].filter(n=>n.isSignal||n.isHub).sort((a,b)=>b.degree-a.degree).slice(0,7);let i=0;
  (function nx(){ if(!touring)return; select(stops[i%stops.length],true);i++;setTimeout(nx,2600);})();};
$('bL').onclick=()=>{$('left').classList.toggle('open');$('right').classList.remove('open');};
$('bR').onclick=()=>{$('right').classList.toggle('open');$('left').classList.remove('open');};

function buildPanels(){
  const top=[...nodes].sort((a,b)=>b.degree-a.degree).slice(0,7);
  $('hubs').innerHTML=top.map(n=>`<div class="hub" data-id="${esc(n.id)}"><span class="sw" style="background:${colorOf(n.category)}"></span>${esc(n.name)}<span class="n">${n.degree}</span></div>`).join('');
  $('hubs').querySelectorAll('.hub').forEach(h=>h.onclick=()=>select(byId.get(h.dataset.id),true));
  $('filters').innerHTML=DATA.categories.map(c=>`<div class="filt" data-c="${esc(c.key)}"><span class="sw" style="background:${colorOf(c.key)}"></span>${c.icon} ${c.key}<span class="n">${c.count}</span></div>`).join('');
  $('filters').querySelectorAll('.filt').forEach(f=>f.onclick=()=>{const c=f.dataset.c;
    if(hidden.has(c)){hidden.delete(c);f.classList.remove('off');}else{hidden.add(c);f.classList.add('off');}});
  const s=DATA.stats; const sg=s.signals?` · ✨ ${s.signals} signals`:'';
  $('subStat').textContent=`${s.notes} notes · ${s.links} links`;
  $('botStat').textContent=`${s.notes} notes · ${s.links} links${sg}`;
  $('vLab').textContent=P.labels; $('vSpread').textContent=SPREAD;
}

// deep-link: BM_Cowork_OS_Brain_3D.html#focus=<query> auto-focuses a matching node/cluster
function focusFromHash(){ const m=(location.hash||'').match(/focus=([^&]+)/); if(!m)return;
  const q=decodeURIComponent(m[1]).toLowerCase().replace(/\+/g,' ');
  const hit=nodes.find(n=>(n.category||'').toLowerCase()===q)
        || nodes.find(n=>(n.title||'').toLowerCase().includes(q)||n.name.toLowerCase().includes(q)||(n.category||'').toLowerCase().includes(q));
  if(hit){ hidden.clear(); select(hit,true); } }
addEventListener('hashchange',focusFromHash);

function syncSwitcher(){ var q=selected?'#focus='+encodeURIComponent(selected.name):''; var sn=selected?(' focused on '+(selected.title||selected.name)):'';
  var a2=document.querySelector('#vsw a[data-v=\'2d\']'); if(a2){a2.href='BM_Cowork_OS_Brain_Map.html'+q;a2.title='Open 2D Map'+sn;}
  var a3=document.querySelector('#vsw a[data-v=\'3d\']'); if(a3){a3.href='BM_Cowork_OS_Brain_3D.html'+q;a3.title='Open 3D Galaxy'+sn;}
  var ad=document.querySelector('#vsw a[data-v=\'dash\']'); if(ad)ad.title='Open the dashboard'; }
function showCrumb(n){var c=document.getElementById('crumb');if(!c)return;c.hidden=false;c.innerHTML='Viewing <b>'+esc(n.title||n.name)+'</b> <button id="crumbx" title="Clear focus">✕</button>';var x=document.getElementById('crumbx');if(x)x.onclick=function(){select(null);};}
function hideCrumb(){var c=document.getElementById('crumb');if(c)c.hidden=true;}
document.getElementById('theme').onclick=function(){applyTheme(LIGHT?'dark':'light');};
applyTheme(THEMEKEY);
resize(); buildPanels(); loop(); focusFromHash();
</script>
</body>
</html>
